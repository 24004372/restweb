<!DOCTYPE html>
<html lang="en">
<head>
  <title>Menu - McDonald's</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff9f0;
      color: #000;
    }

    header {
      background-color: #d70000;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      padding-left: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 2rem;
      font-size: 1.1rem;
    }

    .tagline {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin: 2rem 0 1rem 0;
    }

    h2 {
      text-align: center;
      color: #fff;
      background-color: #ffbc0d;
      padding: 20px;
      margin-top: 40px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      background-color: #ffbc0d;
    }

    .gallery-item {
      background-color: #fff;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .gallery-item p {
      margin: 10px;
      font-weight: 500;
    }
    .gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* increased from 220px */
  gap: 20px;
  padding: 20px;
  background-color: #ffbc0d;
}

.gallery-item img {
  width: 100%;
  height: 250px; /* increased from 180px */
  object-fit: cover;
  display: block;
}


    @media (max-width: 600px) {
      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>McDONALD'S</h1>
    <nav>
      <a href="home.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <div class="tagline">
    I'm Lovin' It
  </div>

  <!-- Burgers -->
  <h2>Burgers</h2>
  <div class="gallery">
    <div class="gallery-item">
      <img src="big macc.jpg" alt="Big Mac" />
      <p>Big Mac</p>
    </div>
    <div class="gallery-item">
      <img src="mc chicken.jpg" alt="McChicken" />
      <p>McChicken</p>
    </div>
    <div class="gallery-item">
      <img src="filet o fishh.webp" alt="Filet-O-Fish" />
      <p>Filet-O-Fish</p>
    </div>
  </div>

  <!-- Sides -->
  <h2>Sides</h2>
  <div class="gallery">
    <div class="gallery-item">
      <img src="ff.jpg" alt="French Fries" />
      <p>World Famous Fries</p>
    </div>
    <div class="gallery-item">
      <img src="nuggets mc1.JPG" alt="Chicken Nuggets" />
      <p>Chicken McNuggets</p>
    </div>
    <div class="gallery-item">
      <img src="moz mc.jpg" alt="Mozzarella Sticks" />
      <p>Mozzarella Sticks</p>
    </div>
  </div>
